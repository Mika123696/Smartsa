name: Smartsa LMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run automated test suite (Vitest)
        run: npm test -- --run

      - name: Build production bundle (Vite)
        run: npm run build
